plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

base {
	archivesName = project.archives_base_name
}

repositories {
	// Loom adds the Minecraft and Fabric repositories automatically.
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"copperpipes" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
}

// `.\gradlew installMod` builds the jar and copies it into a local launcher profile (e.g. Modrinth App).
// The target folder is set per machine in local.properties (not committed): mods_dir=C:/path/to/profile/mods
def localProps = new Properties()
def localPropsFile = file("local.properties")
if (localPropsFile.exists()) localPropsFile.withInputStream { localProps.load(it) }
def modsDir = localProps.getProperty("mods_dir")

tasks.register("installMod", Copy) {
	group = "copperpipes"
	description = "Copies the built mod jar into mods_dir from local.properties"
	onlyIf("mods_dir is set in local.properties") { modsDir != null }
	from(tasks.named("jar"))
	into(modsDir ?: layout.buildDirectory.dir("noModsDir"))
	def target = modsDir
	doFirst {
		// Remove older builds of this mod so the launcher does not load two versions.
		new File(target).listFiles()?.findAll { it.name.startsWith("copperpipes-") && it.name.endsWith(".jar") }*.delete()
	}
}
